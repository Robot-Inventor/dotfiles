# {% set zed_path = env.LOCALAPPDATA | replace(from="\\", to="/") ~ "/Programs/Zed/Zed.exe" %}
# {% else %}
# {% set zed_path = "dev.zed.Zed" %}
# {% endif %}
open-with-app = "Zed|{{ zed_path }}"
default-git-client = "{{ zed_path }}"

# {% if os() == "windows" %}
windows-text-rendering = "natural-symmetric"
autocomplete-inline-provider = "psreadline"
keybind = "ctrl+v=paste"
