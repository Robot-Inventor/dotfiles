#:schema https://mise.jdx.dev/schema/mise.json

[tasks.bootstrap]
description = "Upgrade tools and apply dotfiles"
run = [
  "mise self-update -y",
  "mise upgrade",
  "mise bootstrap packages apply",
  "mise bootstrap packages upgrade",
  "mise run sync-skills",
  "mise run sync-codex-catalog",
  "mise run sync-zen",
  "codex plugin marketplace upgrade"
]
dir = "~/dotfiles"

[tasks.sync-skills]
description = "Sync global agent skills"
run = "bun scripts/sync-skills.ts"
dir = "~/dotfiles"

[tasks.sync-codex-catalog]
description = "Copy the Windows Codex model catalog into WSL"
run = "bash scripts/sync-codex-catalog.sh"
run_windows = "exit /b 0"
dir = "~/dotfiles"

[tasks.sync-zen]
description = "Sync Sine mods and settings with the default Zen profile"
run = "bun scripts/sync-zen.ts"
dir = "~/dotfiles"

[bootstrap.packages]
"winget:Git.Git" = "latest"
"apt:git" = "latest"
"winget:Microsoft.PowerShell" = "latest"
"winget:AlDanial.Cloc" = "latest"
"winget:7zip.7zip" = "latest"
"winget:Microsoft.PowerToys" = "latest"
"winget:Microsoft.WindowsTerminal" = "latest"
# Raycast
"winget:9PFXXSHC64H3" = "latest"
"winget:Starship.Starship" = "latest"
"apt:starship" = "latest"
"apt:fish" = "latest"

[settings]
tool_update.global_auto = true

[tools]
node = "latest"
bun = "latest"
gh = "latest"
ni = "latest"
opencode = "latest"
codex = "latest"
hunk = "latest"
"npm:skills" = "latest"
# mise's "latest" selects the obsolete 0.0.0; this prerelease changed from staged approval to Trusted Publishing.
"npm:tsrs" = { version = "0.23.0-ts7.1.0-beta", trust_policy_excludes = ["tsrs@0.23.0-ts7.1.0-beta"] }
"npm:@bitkyc08/opencodex" = { version = "latest", os = ["windows", "macos"] }

[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"
"~/.gitconfig/settings" = { source = "~/dotfiles/dotfiles/git/.gitconfig", template = "tera" }
"~/.config/git/attributes" = "~/dotfiles/dotfiles/git/.gitattributes"
"~/.config/opencode/AGENTS.md" = "~/dotfiles/dotfiles/codex/AGENTS.md"
"~/.config/opencode/opencode.jsonc" = "~/dotfiles/dotfiles/opencode/opencode.jsonc"
"~/.config/opencode/cli.json" = "~/dotfiles/dotfiles/opencode/cli.json"
"~/.config/otty/config.toml" = { source = "~/dotfiles/dotfiles/otty/config.toml", mode = "template" }
"~/.config/hunk/config.toml" = "~/dotfiles/dotfiles/hunk/config.toml"
"~/.codex/AGENTS.md" = "~/dotfiles/dotfiles/codex/AGENTS.md"
"~/.codex/config.toml/settings" = { source = "~/dotfiles/dotfiles/codex/config.toml", template = "tera", merge = true }
"~/.agents/.skill-lock.json" = "~/dotfiles/dotfiles/skills/.skill-lock.json"

[dotfiles.powershell]
source = "~/dotfiles/dotfiles/powershell/profile.ps1"
variants = [{ os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" }]

[dotfiles.windowsTerminal]
source = "~/dotfiles/dotfiles/windows-terminal/settings.json"
variants = [
  { os = "windows", target = "~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json" },
]

[dotfiles.wsl]
source = "~/dotfiles/dotfiles/wsl/.wslconfig"
variants = [{ os = "windows", target = "~/.wslconfig" }]

[dotfiles.bash]
source = "~/dotfiles/dotfiles/bash/.bashrc"
variants = [{ os = "linux", target = "~/.bashrc" }]

[dotfiles.fish]
source = "~/dotfiles/dotfiles/fish/config.fish"
variants = [{ os = "linux", target = "~/.config/fish/config.fish" }]

[dotfiles.fishKeyBindings]
source = "~/dotfiles/dotfiles/fish/functions/fish_user_key_bindings.fish"
variants = [{ os = "linux", target = "~/.config/fish/functions/fish_user_key_bindings.fish" }]

[dotfiles.zed]
source = "~/dotfiles/dotfiles/zed"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Zed" },
  { os = "macos", target = "~/.config/zed" },
  { os = "linux", target = "~/.config/zed" },
]
