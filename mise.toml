#:schema https://mise.jdx.dev/schema/mise.json

[tasks.bootstrap]
description = "Upgrade tools and apply dotfiles"
run = [
  "mise self-update -y",
  "mise upgrade",
  "mise bootstrap packages apply",
  "mise bootstrap packages upgrade",
  "mise run update-blesh",
  "mise run sync-skills",
]
dir = "~/dotfiles"

[tasks.update-blesh]
description = "Install or update ble.sh"
run = '''
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
curl -fsSL https://github.com/akinomyoga/ble.sh/releases/download/nightly/ble-nightly.tar.xz \
  | tar -xJ -C "$tmp"
bash "$tmp/ble-nightly/ble.sh" --install "$HOME/.local/share"
'''
run_windows = "exit /b 0"

[tasks.sync-skills]
description = "Sync global agent skills"
run = "bun scripts/sync-skills.ts"
dir = "~/dotfiles"

[bootstrap.packages]
"winget:Git.Git" = "latest"
"apt:git" = "latest"
"winget:Microsoft.PowerShell" = "latest"
"winget:AlDanial.Cloc" = "latest"
"winget:7zip.7zip" = "latest"
"winget:Microsoft.PowerToys" = "latest"
"winget:Microsoft.WindowsTerminal" = "latest"

[settings]
tool_update.global_auto = true

[tools]
node = "latest"
bun = "latest"
gh = "latest"
ni = "latest"
opencode = "latest"
codex = "latest"
"npm:skills" = "latest"
"npm:@bitkyc08/opencodex" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"
"~/.gitconfig/settings" = { source = "dotfiles/git/.gitconfig", template = "tera" }
"~/.config/git/attributes" = "dotfiles/git/.gitattributes"
"~/.config/opencode/AGENTS.md" = "dotfiles/codex/AGENTS.md"
"~/.config/opencode/opencode.jsonc" = "dotfiles/opencode/opencode.jsonc"
"~/.config/opencode/cli.json" = "dotfiles/opencode/cli.json"
"~/.config/otty/config.toml" = { source = "dotfiles/otty/config.toml", mode = "template" }
"~/.codex/AGENTS.md" = "dotfiles/codex/AGENTS.md"
"~/.codex/config.toml/settings" = { source = "dotfiles/codex/config.toml", template = "tera" }
"~/.agents/.skill-lock.json" = "dotfiles/skills/.skill-lock.json"

[dotfiles.powershell]
source = "dotfiles/powershell/profile.ps1"
variants = [{ os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" }]

[dotfiles.windowsTerminal]
source = "dotfiles/windows-terminal/settings.json"
variants = [
  { os = "windows", target = "~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json" },
]

[dotfiles.wsl]
source = "dotfiles/wsl/.wslconfig"
variants = [{ os = "windows", target = "~/.wslconfig" }]

[dotfiles.bash]
source = "dotfiles/bash/.bashrc"
variants = [{ os = "linux", target = "~/.bashrc" }]

[dotfiles.blesh]
source = "dotfiles/blesh/.blerc"
variants = [{ os = "linux", target = "~/.blerc" }]

[dotfiles.zed]
source = "dotfiles/zed"
variants = [
  { os = "windows", target = "~/AppData/Roaming/Zed" },
  { os = "macos", target = "~/.config/zed" },
]
